# Audit Gates — automated regression checks for contracts and dependencies.
#
# Complements manual security review: detectors cover known defect classes
# (Misti static analysis, npm audit) but not tokenomics or zero-knowledge logic.
#
# Baseline policy:
# - Misti: fail only on HIGH/CRITICAL (`--min-severity high`); INFO/LOW/MEDIUM
#   baseline triaged as non-security (gas/style/import hygiene).
# - Soufflé not installed on ubuntu-latest CI (Misti 2.4.1 libffi gap) — 3 detectors
#   auto-disabled; full 41-detector run is reproducible via Docker locally.
# - npm audit (contracts): production tree only (`--omit=dev`).
# - npm audit (frontend): `--audit-level=high`.
#
# Note: jobs are not per-path-conditional — a PR touching only frontend/**
# also runs the contracts jobs (kept simple; total cost is a few minutes).

name: Audit Gates

on:
    pull_request:
        paths:
            - 'contracts/**'
            - 'frontend/**'
            - '.github/workflows/audit-gates.yml'
    push:
        branches: [master]
        paths:
            - 'contracts/**'
            - 'frontend/**'
            - '.github/workflows/audit-gates.yml'

jobs:
    misti:
        name: Misti static analysis (contracts)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: contracts
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: contracts/package-lock.json

            - name: Install dependencies
              run: npm ci

            # Exit code 1 from Misti means "findings at or above the
            # threshold", which is exactly the gate condition.
            - name: Misti gate (fail on HIGH/CRITICAL)
              run: npx misti --all-detectors --min-severity high tact.config.json

    npm-audit-contracts:
        name: npm audit (contracts, prod tree)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: contracts
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: npm audit gate (prod dependencies, fail on high+)
              run: npm audit --omit=dev --audit-level=high

            # Informational only: full tree including the triaged dev
            # toolchain (protobufjs et al., TOOLING.md §2). Never fails the
            # gate; kept visible so new toolchain CVEs surface in logs.
            - name: npm audit report (full tree, informational)
              if: always()
              run: npm audit || true

    npm-audit-frontend:
        name: npm audit (frontend)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: npm audit gate (fail on high+)
              run: npm audit --audit-level=high

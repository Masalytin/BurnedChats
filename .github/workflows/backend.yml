name: Backend

on:
    pull_request:
        paths:
            - 'backend/**'
            - 'build.gradle.kts'
            - 'settings.gradle.kts'
            - 'gradle.properties'
            - 'gradle/**'
            - 'config/**'
            - 'docs/specs/openapi.yaml'
            - 'docs/specs/stomp-routes.json'
            - '.github/workflows/backend.yml'
    push:
        branches: [main]
        paths:
            - 'backend/**'
            - 'build.gradle.kts'
            - 'settings.gradle.kts'
            - 'gradle.properties'
            - 'gradle/**'
            - 'config/**'
            - 'docs/specs/openapi.yaml'
            - 'docs/specs/stomp-routes.json'
            - '.github/workflows/backend.yml'

jobs:
    build-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # Literal path — `runner.temp` is not valid in job-level env
            # (GitHub rejects the workflow file and the run dies in 0s).
            FILE_STORAGE_PATH: /tmp/burnedchats-files
        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            # Wrapper may lose +x when committed from Windows (git filemode 100644).
            - name: Make gradlew executable
              run: chmod +x gradlew

            # Unit tests only: @Tag("integration") is excluded from the `test`
            # task; Docker-backed integration tests are opt-in via
            # :backend:integrationTest and are not run in CI.
            - name: Build (compile, checkstyle, spotbugs, unit tests)
              run: ./gradlew :backend:build --no-daemon

            - name: Check API contract artifacts (OpenAPI + STOMP drift)
              run: ./gradlew :backend:checkApiContracts --no-daemon

            - name: Upload test reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-test-reports
                  path: backend/build/reports/

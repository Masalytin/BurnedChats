name: CodeQL

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    schedule:
        # Weekly run catches newly added CodeQL queries against unchanged code
        - cron: '30 4 * * 1'

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: java-kotlin
                      build-mode: manual
                    - language: javascript-typescript
                      build-mode: none
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              if: matrix.language == 'java-kotlin'
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Set up Gradle
              if: matrix.language == 'java-kotlin'
              uses: gradle/actions/setup-gradle@v4
              with:
                  # Restored Gradle build cache serves compileJava FROM-CACHE;
                  # CodeQL then sees no javac and fails with "didn't build any of it".
                  cache-disabled: true

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: ${{ matrix.language }}
                  build-mode: ${{ matrix.build-mode }}
                  queries: security-and-quality

            - name: Build backend (manual mode)
              if: matrix.language == 'java-kotlin'
              run: |
                  chmod +x gradlew
                  ./gradlew :backend:compileJava --no-daemon --no-build-cache --rerun-tasks

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:${{ matrix.language }}"

name: Frontend

on:
    pull_request:
        paths:
            - 'frontend/**'
            - 'scripts/i18n/**'
            - '.github/workflows/frontend.yml'
    push:
        branches: [main]
        paths:
            - 'frontend/**'
            - 'scripts/i18n/**'
            - '.github/workflows/frontend.yml'

defaults:
    run:
        working-directory: frontend

jobs:
    build-test-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: i18n hardcoded UI scan
              run: npm run i18n:scan -- --strict

            - name: Type check
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

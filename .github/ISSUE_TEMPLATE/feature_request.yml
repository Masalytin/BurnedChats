name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, note the project's core invariants: zero-knowledge
        relay (server never sees plaintext or keys), ephemeral Redis-only
        storage with TTL, and client-side crypto. Features that break these
        invariants are unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who runs into it and when?
      placeholder: "As a room owner, I can't ... which means ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen. UI sketches or protocol notes welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fall short.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Frontend (Mini App UI)
        - Backend (relay / API)
        - Cryptography / key exchange
        - Smart contracts / tokenomics
        - Infrastructure / operations
        - Documentation
        - Cross-cutting
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: The proposal respects the zero-knowledge / ephemeral-storage design (or explicitly discusses the trade-off).
          required: true

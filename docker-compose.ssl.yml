# Docker Compose configuration with SSL support for local development
# 
# Prerequisites:
#   1. Install mkcert: https://github.com/FiloSottile/mkcert
#   2. Run: ./scripts/setup-ssl.sh --install-ca  (Unix/macOS)
#      Or:  .\scripts\setup-ssl.ps1 -InstallCA   (Windows, as Admin)
#
# Usage:
#   docker-compose -f docker-compose.ssl.yml up --build
#
# Access:
#   https://localhost:3000

services:
  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: burnedchats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Ex: keyspace expiry for auto-burn / deadman. volatile-ttl: do not evict keys without TTL.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-ttl --notify-keyspace-events Ex
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - burnedchats-network

  # ===== Backend (Spring Boot) =====
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: burnedchats-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs
    networks:
      - burnedchats-network

  # ===== Frontend (React + Nginx with SSL) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: burnedchats-frontend
    restart: unless-stopped
    ports:
      - "3000:443"
      - "3080:80"  # HTTP redirect port
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Mount SSL certificates
      - ./certs:/etc/nginx/certs:ro
      # Override nginx config with SSL version
      - ./frontend/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - burnedchats-network

volumes:
  redis-data:
    driver: local

networks:
  burnedchats-network:
    driver: bridge

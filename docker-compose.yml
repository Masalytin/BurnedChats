services:
  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: burnedchats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - burnedchats-network

  # ===== Backend (Spring Boot) =====
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: burnedchats-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-BurnedChatsBot}
      - TELEGRAM_MINI_APP_URL=${TELEGRAM_MINI_APP_URL:-https://localhost:3000}
      # Dev-only login bypass (absent in docker-compose.prod.yml; see SECURITY.md).
      # Set DEV_AUTH_ENABLED=true explicitly for local agent/UI testing (default: off).
      - DEV_AUTH_ENABLED=${DEV_AUTH_ENABLED:-false}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs
      - backend-files:/data/files
    networks:
      - burnedchats-network

  # ===== Frontend (React + Nginx) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: burnedchats-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - burnedchats-network

volumes:
  redis-data:
    driver: local
  backend-files:
    driver: local

networks:
  burnedchats-network:
    driver: bridge


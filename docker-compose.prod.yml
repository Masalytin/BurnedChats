# Production Docker Compose with Let's Encrypt SSL
#
# Prerequisites:
#   1. Set up .env.prod file (copy from .env.example)
#   2. Point domain DNS A record to server IP
#   3. Open ports 80 and 443 on firewall
#
# First run (get SSL certificates):
#   docker compose -f docker-compose.prod.yml up -d nginx-certbot
#   docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/certbot -d burnedchats.net -d www.burnedchats.net --email your@email.com --agree-tos --no-eff-email
#   docker compose -f docker-compose.prod.yml down
#
# Start all services (always pass --env-file for substitution + runtime secrets):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Testnet prod defaults below (SPRING_PROFILES_ACTIVE, TONCENTER_*). For mainnet later,
# override in .env.prod: SPRING_PROFILES_ACTIVE=prod, TONCENTER_ENDPOINT=https://toncenter.com/api/v2,
# VITE_TON_NETWORK=mainnet, VITE_TON_RPC_URL=https://toncenter.com/api/v2
#
# Renew certificates (add to crontab):
#   0 0 1 * * cd /path/to/project && docker compose -f docker-compose.prod.yml run --rm certbot renew && docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

services:
  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: burnedchats-redis
    restart: always
    env_file:
      - .env.prod
    volumes:
      - redis-data:/data
    # Ex: keyspace expiry for auto-burn / deadman. volatile-ttl: do not evict keys without TTL.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-ttl
      --notify-keyspace-events Ex
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ===== Backend (Spring Boot) =====
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: burnedchats-backend
    restart: always
    env_file:
      - .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod,testnet}
      - TONCENTER_API_KEY=${TONCENTER_API_KEY}
      - TONCENTER_ENDPOINT=${TONCENTER_ENDPOINT:-https://testnet.toncenter.com/api/v2}
      - BURNEDCHATS_TON_API_BASE_URL=${BURNEDCHATS_TON_API_BASE_URL:-https://testnet.toncenter.com/api/v2}
      - BURN_JETTON_MASTER_ADDRESS=${BURN_JETTON_MASTER_ADDRESS}
      - BURN_STAKING_MASTER_ADDRESS=${BURN_STAKING_MASTER_ADDRESS}
      - BURN_GOVERNOR_ADDRESS=${BURN_GOVERNOR_ADDRESS}
      - BURN_TREASURY_ADDRESS=${BURN_TREASURY_ADDRESS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - TELEGRAM_WEBHOOK_URL=https://${DOMAIN}/api/telegram/webhook
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_MINI_APP_URL=https://${DOMAIN}
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN},https://www.${DOMAIN}
      - LOG_PATH=/app/logs
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - backend-logs:/app/logs
      - backend-files:/data/files
    networks:
      - internal

  # ===== Frontend (React build) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=https://${DOMAIN}
        - VITE_WS_URL=https://${DOMAIN}/ws
        - VITE_TELEGRAM_BOT_URL=https://t.me/BurnedChatsBot
        - VITE_GITHUB_URL=https://github.com/Masalytin/BurnedChats
        - VITE_TONCONNECT_MANIFEST_URL=https://${DOMAIN}/tonconnect-manifest.json
        - VITE_TON_NETWORK=mainnet
        - VITE_TON_RPC_URL=https://toncenter.com/api/v2
        - VITE_TONCENTER_API_KEY=${TONCENTER_API_KEY}
        - VITE_BURN_JETTON_MASTER=${BURN_JETTON_MASTER_ADDRESS}
        - VITE_STAKING_MASTER=${BURN_STAKING_MASTER_ADDRESS}
        - VITE_GOVERNOR_ADDRESS=${BURN_GOVERNOR_ADDRESS}
        - VITE_TREASURY_ADDRESS=${BURN_TREASURY_ADDRESS}
    container_name: burnedchats-frontend
    restart: always
    networks:
      - internal

  # ===== Redis Insight (GUI) — opt-in only; never default-on =====
  # Enable with: docker compose -f docker-compose.prod.yml --env-file .env.prod --profile debug up -d redisinsight
  # Access only via SSH tunnel / VPN to the container network — no public nginx vhost.
  redisinsight:
    image: redis/redisinsight:latest
    container_name: burnedchats-redisinsight
    restart: always
    profiles:
      - debug
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  # ===== Nginx (Reverse Proxy + SSL) =====
  nginx:
    image: nginx:alpine
    container_name: burnedchats-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

  # ===== Nginx for initial cert (before SSL is ready) =====
  nginx-certbot:
    image: nginx:alpine
    container_name: burnedchats-nginx-certbot
    ports:
      - "80:80"
    volumes:
      - ./nginx/certbot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
    profiles:
      - certbot

  # ===== Certbot (SSL certificates) =====
  certbot:
    image: certbot/certbot
    container_name: burnedchats-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    profiles:
      - certbot

volumes:
  redis-data:
    driver: local
  backend-logs:
    driver: local
  backend-files:
    driver: local
  redisinsight-data:
    driver: local

networks:
  internal:
    driver: bridge

# Test profile configuration
# Activated automatically by Spring Boot Test

spring:
  data:
    redis:
      # Testcontainers will override these
      host: localhost
      port: 6379
      password: ""

server:
  port: 0  # Random port for tests

# Minimal logging in tests
logging:
  level:
    root: WARN
    dev.burnedchats: DEBUG
    org.springframework.test: WARN

# Test Telegram settings
telegram:
  bot:
    # Blank token: keeps TelegramBotConfig from calling the real api.registerBot()
    # (live deleteWebhook -> [404] -> Spring context fails to load for every @SpringBootTest
    # on the `test` profile). HMAC/initData unit tests construct TelegramAuthService with their
    # own token and are unaffected. See IMP-AUDIT-27.
    token: ""
    username: TestBot
    webhook:
      enabled: false
  mini-app:
    url: https://test.example.com
    auth:
      max-age: 3600  # Extended for tests

# Disable rate limiting in tests
rate-limit:
  enabled: false

pow:
  enabled: false

# Test CORS
security:
  cors:
    allowed-origins: "*"

burnedchats:
  messages:
    offline-queue:
      keyspace-listener-enabled: false
  users:
    deadman:
      keyspace-listener-enabled: false


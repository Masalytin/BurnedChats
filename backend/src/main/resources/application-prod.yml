# Production profile configuration
# Activated by: SPRING_PROFILES_ACTIVE=prod

spring:
  data:
    redis:
      # Production Redis settings (from environment)
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-connections: 5000
    threads:
      max: 400

# Production logging - less verbose
logging:
  level:
    root: WARN
    dev.burnedchats: INFO
    org.springframework: WARN
    io.lettuce.core: WARN
  file:
    name: ${LOG_PATH:/var/log/burnedchats}/burned-chats.log

# Production Telegram settings
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
    webhook:
      enabled: true
      url: ${TELEGRAM_WEBHOOK_URL}
      secret-token: ${TELEGRAM_WEBHOOK_SECRET}
  mini-app:
    url: ${TELEGRAM_MINI_APP_URL}

# Strict rate limits in production
rate-limit:
  enabled: true
  requests:
    per-minute: 60
    per-hour: 1000
  messages:
    per-minute: 30
    per-session: 100

# Production CORS - restrict origins
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Actuator - hide details in production
management:
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI / Swagger UI disabled in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# DM/room message list limits (default from application.yml; override in env if needed)
burnedchats:
  messages:
    offline-queue:
      ttl: ${BURNEDCHATS_OFFLINE_MSG_QUEUE_TTL:PT24H}
      max-size-per-session: ${BURNEDCHATS_OFFLINE_MSG_QUEUE_MAX_PER_SESSION:100}
      max-size-per-room: ${BURNEDCHATS_OFFLINE_MSG_QUEUE_MAX_PER_ROOM:500}
      keyspace-listener-enabled: ${BURNEDCHATS_OFFLINE_MSG_KEYSPACE_LISTENER:true}

# TON reads (mainnet)
app:
  ton:
    network: mainnet
    rpc:
      endpoint: ${TONCENTER_ENDPOINT:https://toncenter.com/api/v2}
      api-key: ${TONCENTER_API_KEY}
      timeout-ms: ${TONCENTER_TIMEOUT_MS:5000}
      retry-attempts: ${TONCENTER_RETRY_ATTEMPTS:3}
    cache:
      ttl-seconds: ${TONCACHE_TTL_SECONDS:60}
    addresses:
      jetton-master: ${BURN_JETTON_MASTER_ADDRESS:}



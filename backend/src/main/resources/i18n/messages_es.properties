# /start command
bot.start.text=\uD83D\uDD25 <b>BurnedChats</b>\n\n¡Bienvenido al mensajero seguro!\n\n\u2753 <b>¿Qué es esto?</b>\nUna aplicación para chats secretos con cifrado de extremo a extremo. Los mensajes no se almacenan en el servidor.\n\n\u2705 <b>Cómo funciona:</b>\n\u2022 Encuentra a tu contacto por @username\n\u2022 Espera la confirmación de conexión\n\u2022 Intercambia mensajes\n\u2022 Pulsa ?Burn? para destruir el chat\n\n\uD83D\uDEE1\uFE0F <b>Seguridad:</b>\n\u2022 Cifrado AES-256-GCM + ECDH\n\u2022 Las claves se generan en tu dispositivo\n\u2022 El servidor no puede leer tus mensajes\n\u2022 Los datos se destruyen sin posibilidad de recuperación\n\nPulsa el botón de abajo para comenzar \uD83D\uDE80
bot.start.button=\uD83D\uDE80 Abrir BurnedChats

# /help command
bot.help.text=\u2753 <b>Ayuda ? BurnedChats</b>\n\n\uD83D\uDE80 <b>Funciones principales:</b>\n\n\u2705 <b>Iniciar un chat</b>\n1. Abre la aplicación\n2. Introduce el @username de tu contacto\n3. Envía una solicitud de conexión\n4. Espera la confirmación\n\n\uD83D\uDD11 <b>Conexión segura</b>\nDespués de la confirmación, verifica la ?huella de seguridad? ? debe coincidir en ambos lados.\n\n\uD83D\uDD25 <b>Destruir chat</b>\nPulsa el botón ?Burn? para destruir completamente la conversación. Los datos se eliminan para todos los participantes.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDD10 <b>FAQ:</b>\n\n<b>P: ¿Pueden leer mis mensajes?</b>\nR: No. Se utiliza cifrado de extremo a extremo. Las claves se almacenan solo en los dispositivos.\n\n<b>P: ¿Los mensajes se almacenan en el servidor?</b>\nR: No. El servidor solo retransmite datos cifrados. Se eliminan después de la entrega.\n\n<b>P: ¿Qué pasa cuando presionas ?burn??</b>\nR: Todos los datos del chat se destruyen en todos los dispositivos, incluidas las claves de cifrado.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDEE1\uFE0F ¿Preguntas? Contacta con soporte.

# Unknown command
bot.unknown.text=\u2753 Comando desconocido.\n\nUsa /help para obtener información o pulsa el botón de abajo:

# Bot command descriptions
bot.cmd.start=Iniciar chat privado
bot.cmd.help=Ayuda e información
bot.cmd.burn=Eliminaci\u00F3n remota de datos

bot.burn.noData=\u2139\uFE0F No hay datos en el servidor para esta cuenta de Telegram.
bot.burn.confirm.text=\uD83D\uDD25 <b>Eliminaci\u00F3n remota</b>\n\nElige qu\u00E9 destruir en el servidor. Esta acci\u00F3n no se puede deshacer.\n\nLa confirmaci\u00F3n expira en 60 segundos.
bot.burn.confirm.linkedWallet=\uD83D\uDD25 <b>Eliminaci\u00F3n remota</b>\n\nTelegram est\u00E1 vinculado a una cuenta wallet \u2014 ambos comparten el mismo perfil en el servidor.\n\nElige qu\u00E9 destruir. Esta acci\u00F3n no se puede deshacer.\n\nLa confirmaci\u00F3n expira en 60 segundos.
bot.burn.button.data=\uD83D\uDD25 Quemar todos los datos
bot.burn.button.account=\uD83D\uDC80 Quemar cuenta
bot.burn.button.cancel=Cancelar
bot.burn.cancelled=Cancelado.
bot.burn.expired=\u23F0 Confirmaci\u00F3n expirada. Env\u00EDa /burn de nuevo.
bot.burn.invalid=Acci\u00F3n desconocida.
bot.burn.processing=Procesando\u2026
bot.burn.complete=\u2705 <b>Eliminaci\u00F3n completada</b>\n\nQuemados: {0} chats, {1} salas propias, saliste de {2} salas ajenas.

# Notifications
bot.notify.chatRequest=\uD83D\uDD14 <b>Nueva solicitud de chat privado</b>\n\nAlguien quiere iniciar una conversación segura contigo.
bot.notify.chatRequest.button=\u2705 Abrir
bot.notify.newMessage=\uD83D\uDCAC <b>Tienes un nuevo mensaje cifrado</b>
bot.notify.newMessage.button=\uD83D\uDCD6 Leer
bot.notify.sessionBurned=\uD83D\uDD25 <b>El chat fue destruido</b>\n\nTu compañero terminó la sesión. Todos los datos han sido eliminados.
bot.notify.newFile=\uD83D\uDCCE <b>Nuevo archivo en el chat cifrado</b>\n\nAbre la aplicación para verlo o descargarlo.
bot.notify.newFile.button=\uD83D\uDCD6 Abrir

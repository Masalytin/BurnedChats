# /start command
bot.start.text=\uD83D\uDD25 <b>BurnedChats</b>\n\nWillkommen im sicheren Messenger!\n\n\u2753 <b>Was ist das?</b>\nEine App für geheime Chats mit Ende-zu-Ende-Verschlüsselung. Nachrichten werden nicht auf dem Server gespeichert.\n\n\u2705 <b>So funktioniert es:</b>\n\u2022 Finde deinen Kontakt über @username\n\u2022 Warte auf die Bestätigung der Verbindung\n\u2022 Tausche Nachrichten aus\n\u2022 Drücke ?Burn?, um den Chat zu zerstören\n\n\uD83D\uDEE1\uFE0F <b>Sicherheit:</b>\n\u2022 AES-256-GCM + ECDH Verschlüsselung\n\u2022 Schlüssel werden auf deinem Gerät erzeugt\n\u2022 Der Server kann deine Nachrichten nicht lesen\n\u2022 Daten werden ohne Wiederherstellungsmöglichkeit gelöscht\n\nTippe auf die Schaltfläche unten, um zu starten \uD83D\uDE80
bot.start.button=\uD83D\uDE80 BurnedChats öffnen

# /help command
bot.help.text=\u2753 <b>Hilfe ? BurnedChats</b>\n\n\uD83D\uDE80 <b>Hauptfunktionen:</b>\n\n\u2705 <b>Chat starten</b>\n1. Öffne die App\n2. Gib den @username deines Kontakts ein\n3. Sende eine Verbindungsanfrage\n4. Warte auf die Bestätigung\n\n\uD83D\uDD11 <b>Sichere Verbindung</b>\nNach der Bestätigung überprüfe den ?Sicherheits-Fingerprint? ? er muss auf beiden Seiten identisch sein.\n\n\uD83D\uDD25 <b>Chat zerstören</b>\nDrücke die ?Burn?-Taste, um die Unterhaltung vollständig zu löschen. Die Daten werden für alle Teilnehmer gelöscht.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDD10 <b>FAQ:</b>\n\n<b>F: Können meine Nachrichten gelesen werden?</b>\nA: Nein. Es wird Ende-zu-Ende-Verschlüsselung verwendet. Schlüssel werden nur auf Geräten gespeichert.\n\n<b>F: Werden Nachrichten auf dem Server gespeichert?</b>\nA: Nein. Der Server überträgt nur verschlüsselte Daten. Sie werden nach der Zustellung gelöscht.\n\n<b>F: Was passiert beim ?Burn??</b>\nA: Alle Chatdaten werden auf allen Geräten zerstört, einschließlich der Verschlüsselungsschlüssel.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDEE1\uFE0F Fragen? Kontaktiere den Support.

# Unknown command
bot.unknown.text=\u2753 Unbekannter Befehl.\n\nVerwende /help für Informationen oder tippe auf die Schaltfläche unten:

# Bot command descriptions
bot.cmd.start=Privaten Chat starten
bot.cmd.help=Hilfe und Informationen


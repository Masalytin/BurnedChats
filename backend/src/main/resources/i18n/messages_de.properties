bot.burn.confirm.linkedWallet=\uD83D\uDD25 <b>Fernl\u00F6schung</b>\n\nTelegram ist mit einem Wallet-Konto verkn\u00FCpft \u2014 beide teilen dasselbe Serverprofil.\n\nW\u00E4hlen Sie, was zerst\u00F6rt werden soll. Dies kann nicht r\u00FCckg\u00E4ngig gemacht werden.\n\nBest\u00E4tigung l\u00E4uft in 60 Sekunden ab.
bot.burn.button.data=\uD83D\uDD25 Alle Daten l\u00F6schen
bot.burn.button.account=\uD83D\uDC80 Konto l\u00F6schen
bot.burn.button.cancel=Abbrechen
bot.burn.cancelled=Abgebrochen.
bot.burn.expired=\u23F0 Best\u00E4tigung abgelaufen. Senden Sie /burn erneut.
bot.burn.invalid=Unbekannte Aktion.
bot.burn.processing=Wird verarbeitet\u2026
bot.burn.complete=\u2705 <b>L\u00F6schung abgeschlossen</b>\n\nGel\u00F6scht: {0} Chats, {1} eigene R\u00E4ume, {2} fremde R\u00E4ume verlassen.


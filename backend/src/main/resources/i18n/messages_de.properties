bot.notify.chatRequest=\uD83D\uDD14 <b>Neue private Chat-Anfrage</b>\n\nJemand möchte eine sichere Unterhaltung mit dir starten.
bot.notify.chatRequest.button=\u2705 Öffnen
bot.notify.newMessage=\uD83D\uDCAC <b>Du hast eine neue verschlüsselte Nachricht</b>
bot.notify.newMessage.button=\uD83D\uDCD6 Lesen
bot.notify.sessionBurned=\uD83D\uDD25 <b>Chat wurde zerstört</b>\n\nDein Partner hat die Sitzung beendet. Alle Daten wurden gelöscht.
bot.notify.newFile=\uD83D\uDCCE <b>Neue Datei im verschlüsselten Chat</b>\n\nÖffne die App, um sie anzusehen oder herunterzuladen.
bot.notify.newFile.button=\uD83D\uDCD6 Öffnen

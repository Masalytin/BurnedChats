# /start command
bot.start.text=🔥 <b>BurnedChats</b>\n\nЛаскаво просимо до захищеного месенджера!\n\n❓ <b>Що це?</b>\nДодаток для таємного листування з end-to-end шифруванням. Повідомлення не зберігаються на сервері.\n\n✅ <b>Як це працює:</b>\n• Знайдіть співрозмовника за @username\n• Дочекайтеся підтвердження з'єднання\n• Обмінюйтеся повідомленнями\n• Натисніть «Спалити», щоб знищити чат\n\n🛡️ <b>Безпека:</b>\n• Шифрування AES-256-GCM + ECDH\n• Ключі генеруються на пристрої\n• Сервер не бачить ваших повідомлень\n• Дані знищуються без можливості відновлення\n\nНатисніть кнопку нижче, щоб почати 🚀
bot.start.button=🚀 Відкрити BurnedChats

# /help command
bot.help.text=❓ <b>Довідка — BurnedChats</b>\n\n🚀 <b>Основні функції:</b>\n\n✅ <b>Почати чат</b>\n1. Відкрийте додаток\n2. Введіть @username співрозмовника\n3. Надішліть запит на зв'язок\n4. Дочекайтеся підтвердження\n\n🔐 <b>Захищене з'єднання</b>\nПісля підтвердження перевірте «відбиток безпеки» — він має збігатися в обох учасників.\n\n🔥 <b>Спалити чат</b>\nНатисніть кнопку «Спалити» для повного знищення переписки. Дані видаляються у всіх учасників.


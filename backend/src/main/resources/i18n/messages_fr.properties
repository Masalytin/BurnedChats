# /start command
bot.start.text=\uD83D\uDD25 <b>BurnedChats</b>\n\nBienvenue dans la messagerie sécurisée !\n\n\u2753 <b>Qu'est-ce que c'est ?</b>\nUne application pour des discussions secrètes avec chiffrement de bout en bout. Les messages ne sont pas stockés sur le serveur.\n\n\u2705 <b>Comment ça fonctionne :</b>\n\u2022 Trouvez votre contact par @username\n\u2022 Attendez la confirmation de connexion\n\u2022 Échangez des messages\n\u2022 Appuyez sur « Burn » pour détruire le chat\n\n\uD83D\uDEE1\uFE0F <b>Sécurité :</b>\n\u2022 Chiffrement AES-256-GCM + ECDH\n\u2022 Les clés sont générées sur votre appareil\n\u2022 Le serveur ne peut pas lire vos messages\n\u2022 Les données sont détruites sans possibilité de récupération\n\nAppuyez sur le bouton ci-dessous pour commencer \uD83D\uDE80
bot.start.button=\uD83D\uDE80 Ouvrir BurnedChats

# /help command
bot.help.text=\u2753 <b>Aide ? BurnedChats</b>\n\n\uD83D\uDE80 <b>Fonctionnalités principales :</b>\n\n\u2705 <b>Démarrer un chat</b>\n1. Ouvrez l'application\n2. Entrez le @username de votre contact\n3. Envoyez une demande de connexion\n4. Attendez la confirmation\n\n\uD83D\uDD11 <b>Connexion sécurisée</b>\nAprès confirmation, vérifiez l'« empreinte de sécurité » ? elle doit être identique des deux côtés.\n\n\uD83D\uDD25 <b>Détruire le chat</b>\nAppuyez sur le bouton « Burn » pour supprimer complètement la conversation. Les données sont supprimées pour tous les participants.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDD10 <b>FAQ :</b>\n\n<b>Q : Mes messages peuvent-ils être lus ?</b>\nA : Non. Le chiffrement de bout en bout est utilisé. Les clés sont stockées uniquement sur les appareils.\n\n<b>Q : Les messages sont-ils stockés sur le serveur ?</b>\nA : Non. Le serveur relaie uniquement les données chiffrées. Elles sont supprimées après livraison.\n\n<b>Q : Que se passe-t-il lorsque vous « burn » ?</b>\nA : Toutes les données du chat sont détruites sur tous les appareils, y compris les clés de chiffrement.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDEE1\uFE0F Des questions ? Contactez le support.

# Unknown command
bot.unknown.text=\u2753 Commande inconnue.\n\nUtilisez /help pour obtenir des informations ou appuyez sur le bouton ci-dessous :

# Bot command descriptions
bot.cmd.start=Démarrer un chat privé
bot.cmd.help=Aide et informations

# Notifications
bot.notify.chatRequest=\uD83D\uDD14 <b>Nouvelle demande de chat privé</b>\n\nQuelqu'un souhaite démarrer une conversation sécurisée avec vous.
bot.notify.chatRequest.button=\u2705 Ouvrir
bot.notify.newMessage=\uD83D\uDCAC <b>Vous avez un nouveau message chiffré</b>
bot.notify.newMessage.button=\uD83D\uDCD6 Lire
bot.notify.sessionBurned=\uD83D\uDD25 <b>Le chat a été détruit</b>\n\nVotre interlocuteur a terminé la session. Toutes les données ont été supprimées.
bot.notify.newFile=\uD83D\uDCCE <b>Nouveau fichier dans le chat chiffré</b>\n\nOuvrez l'application pour le consulter ou le télécharger.
bot.notify.newFile.button=\uD83D\uDCD6 Ouvrir

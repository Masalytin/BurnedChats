bot.burn.confirm.linkedWallet=\uD83D\uDD25 <b>Suppression \u00E0 distance</b>\n\nTelegram est li\u00E9 \u00E0 un compte wallet \u2014 les deux partagent le m\u00EAme profil serveur.\n\nChoisissez quoi d\u00E9truire. Action irr\u00E9versible.\n\nConfirmation valable 60 secondes.

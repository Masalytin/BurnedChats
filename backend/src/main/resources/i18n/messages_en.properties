# /start command
bot.start.text=\uD83D\uDD25 <b>BurnedChats</b>\n\nWelcome to the secure messenger!\n\n\u2753 <b>What is this?</b>\nAn app for secret chats with end-to-end encryption. Messages are not stored on the server.\n\n\u2705 <b>How it works:</b>\n\u2022 Find your contact by @username\n\u2022 Wait for the connection to be confirmed\n\u2022 Exchange messages\n\u2022 Press \u201cBurn\u201d to destroy the chat\n\n\uD83D\uDEE1\uFE0F <b>Security:</b>\n\u2022 AES-256-GCM + ECDH encryption\n\u2022 Keys are generated on your device\n\u2022 Server cannot read your messages\n\u2022 Data is destroyed without possibility of recovery\n\nTap the button below to start \uD83D\uDE80
bot.start.button=\uD83D\uDE80 Open BurnedChats

# /help command
bot.help.text=\u2753 <b>Help \u2014 BurnedChats</b>\n\n\uD83D\uDE80 <b>Main features:</b>\n\n\u2705 <b>Start a chat</b>\n1. Open the app\n2. Enter your contact\u2019s @username\n3. Send a connection request\n4. Wait for confirmation\n\n\uD83D\uDD11 <b>Secure connection</b>\nAfter confirmation, verify the \u201csecurity fingerprint\u201d \u2014 it must match on both sides.\n\n\uD83D\uDD25 <b>Burn chat</b>\nPress the \u201cBurn\u201d button to completely destroy the conversation. Data is deleted for all participants.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDD10 <b>FAQ:</b>\n\n<b>Q: Can my messages be read?</b>\nA: No. End-to-end encryption is used. Keys are stored only on devices.\n\n<b>Q: Are messages stored on the server?</b>\nA: No. The server only relays encrypted data. It is deleted after delivery.\n\n<b>Q: What happens when you \u201cburn\u201d?</b>\nA: All chat data is destroyed on all devices, including encryption keys.\n\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\uD83D\uDEE1\uFE0F Have questions? Contact support.

# Unknown command
bot.unknown.text=\u2753 Unknown command.\n\nUse /help for information or tap the button below:


bot.burn.noData=\u2139\uFE0F No server data found for this Telegram account.
bot.burn.confirm.text=\uD83D\uDD25 <b>Remote burn</b>\n\nChoose what to destroy on the server. This cannot be undone.\n\nConfirmation expires in 60 seconds.
bot.burn.confirm.linkedWallet=\uD83D\uDD25 <b>Remote burn</b>\n\nYour Telegram is linked to a wallet account \u2014 both share the same server profile and will be affected together.\n\nChoose what to destroy. This cannot be undone.\n\nConfirmation expires in 60 seconds.
bot.burn.button.data=\uD83D\uDD25 Burn all data
bot.burn.button.account=\uD83D\uDC80 Burn account
bot.burn.button.cancel=Cancel
bot.burn.cancelled=Cancelled.
bot.burn.expired=\u23F0 Confirmation expired. Send /burn again.
bot.burn.invalid=Unknown action.
bot.burn.processing=Processing\u2026

# BurnedChats Backend Configuration
# Sprint 1.2: Foundation setup

spring:
  application:
    name: burned-chats-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Redis configuration (Sprint 1.2.5)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
        shutdown-timeout: 100ms

  # Jackson JSON configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ""
  tomcat:
    connection-timeout: 30s
    max-connections: 2000
    accept-count: 100
    threads:
      max: 200
      min-spare: 10
  # Compression for responses
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# WebSocket configuration (Sprint 1.2.4)
websocket:
  # Heartbeat intervals in milliseconds
  heartbeat:
    server: 10000   # Server sends heartbeat every 10s
    client: 10000   # Client expected heartbeat every 10s
  # Message settings
  message:
    max-size: 65536  # 64KB max message size
  # Send settings
  send:
    buffer-size: 524288  # 512KB send buffer
    timeout: 15000       # 15s send timeout
  # STOMP CONNECT auth — reactive Redis/user lookup runs on boundedElastic (IMP-AUDIT-05);
  # this timeout caps how long CONNECT waits for that bridge to complete.
  auth:
    timeout: ${WEBSOCKET_AUTH_TIMEOUT:30s}

# Telegram Bot configuration (Sprint 2.1)
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:BurnedChatsBot}
    # Webhook settings (production)
    webhook:
      enabled: ${TELEGRAM_WEBHOOK_ENABLED:false}
      url: ${TELEGRAM_WEBHOOK_URL:}
      path: /api/telegram/webhook
      secret-token: ${TELEGRAM_WEBHOOK_SECRET:}
  # Mini App settings
  mini-app:
    url: ${TELEGRAM_MINI_APP_URL:}
    # initData validation
    auth:
      # Max age of initData in seconds (24 hours).
      # WebApp.initData is issued once when the Mini App opens and cannot
      # be refreshed without reopening.  A short TTL would break HTTP
      # endpoints (e.g. file upload) while the user is still chatting
      # over an already-authenticated WebSocket session.
      max-age: ${TELEGRAM_AUTH_MAX_AGE:86400}

# BurnedChats application-specific settings
burnedchats:
  wallet-auth:
    nonce-ttl: ${BURNEDCHATS_WALLET_NONCE_TTL:PT5M}
    proof-max-age: ${BURNEDCHATS_WALLET_PROOF_MAX_AGE:PT5M}
    session-token-ttl: ${BURNEDCHATS_WALLET_SESSION_TOKEN_TTL:PT1H}
    domain: ${BURNEDCHATS_WALLET_DOMAIN:burnedchats.net}
    ton-api-base-url: ${BURNEDCHATS_TON_API_BASE_URL:https://toncenter.com/api/v2}
    ton-api-key: ${BURNEDCHATS_TON_API_KEY:}
  messages:
    # Server-initiated sync on STOMP CONNECT (FIX-SYNC-4).
    # When enabled, on each WebSocket connect the backend fans out any
    # pending offline messages for the user without waiting for the
    # client to request /app/message.sync. Disable to fall back to the
    # client-driven sync path.
    server-push-sync:
      enabled: ${BURNEDCHATS_SERVER_PUSH_SYNC_ENABLED:true}
      concurrency: ${BURNEDCHATS_SERVER_PUSH_SYNC_CONCURRENCY:4}
    # DM + room list TTL/cap; must be <= session.active.ttl for 1:1
    # (aligned below at 24h for offline list + session)
    offline-queue:
      ttl: ${BURNEDCHATS_OFFLINE_MSG_QUEUE_TTL:PT24H}
      max-size-per-session: ${BURNEDCHATS_OFFLINE_MSG_QUEUE_MAX_PER_SESSION:100}
      max-size-per-room: ${BURNEDCHATS_OFFLINE_MSG_QUEUE_MAX_PER_ROOM:500}
      keyspace-listener-enabled: ${BURNEDCHATS_OFFLINE_MSG_KEYSPACE_LISTENER:true}
  users:
    deadman:
      keyspace-listener-enabled: ${BURNEDCHATS_DEADMAN_KEYSPACE_LISTENER:true}
  # Periodic SCAN+LLEN sum for Micrometer size gauges
  metrics:
    offline-queue:
      scan-interval-ms: ${BURNEDCHATS_OFFLINE_QUEUE_SCAN_MS:60000}

# Session and request settings
session:
  # Chat request expiration (5 minutes)
  request:
    ttl: 300
  # Active session expiration (24 hours of inactivity; must be >= messages.offline-queue.ttl)
  active:
    ttl: ${SESSION_ACTIVE_TTL:86400}
  # Pending handshake timeout (30 seconds)
  handshake:
    timeout: 30

# Rate limiting configuration
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  # Requests per window
  requests:
    per-minute: 60
    per-hour: 1000
  # Public REST surfaces (IMP-SECHARD-02)
  rest:
    auth:
      requests-per-minute: 20
    rpc:
      # Defaults to rate-limit.requests.per-minute when unset (0 = inherit)
      requests-per-minute: 0
  # Message rate limits (drives RateLimitType.MESSAGE)
  messages:
    per-minute: 60
    per-session: 100
  # Failed room-password proofs (SEC-8 / SECURITY.md: 5 per 10 min)
  room-password-fail:
    per-window: 5
    window-seconds: 600

# Proof-of-Work anti-spam (DESIGN.md — antispam-pow group)
pow:
  enabled: ${POW_ENABLED:true}
  challenge-ttl: 60s
  replay-window: 120s
  ceiling: 18
  abuse-window: 60s
  base:
    search: 12
    session-create: 14
    invite: 14
    room-create: 16
    dm-invite: 14

# Security settings
security:
  # CORS configuration
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,OPTIONS
    allowed-headers: "*"
    max-age: 3600

# Actuator endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  info:
    env:
      enabled: true

# File storage configuration (Phase 4: Media)
app:
  files:
    storage-path: ${FILE_STORAGE_PATH:/data/files/}
    max-file-size: ${FILE_MAX_SIZE:27262976}  # 26 MB (encrypted blob ceiling, see ValidationConstants)
    metadata-ttl: ${FILE_METADATA_TTL:PT24H}  # 24 hours (ISO-8601)
    cleanup-interval: ${FILE_CLEANUP_INTERVAL:PT15M}  # 15 minutes
    cleanup-enabled: ${FILE_CLEANUP_ENABLED:true}
    max-concurrent-downloads-per-user: ${FILE_MAX_CONCURRENT_DOWNLOADS:3}
    concurrent-download-slot-ttl: ${FILE_CONCURRENT_DOWNLOAD_SLOT_TTL:PT30M}
  # TON Center API (Phase 5: BURN token reads) — testnet by default
  ton:
    network: testnet
    rpc:
      endpoint: ${TONCENTER_ENDPOINT:https://testnet.toncenter.com/api/v2}
      api-key: ${TONCENTER_API_KEY:}
      timeout-ms: ${TONCENTER_TIMEOUT_MS:5000}
      retry-attempts: ${TONCENTER_RETRY_ATTEMPTS:3}
    cache:
      ttl-seconds: ${TONCACHE_TTL_SECONDS:60}
    addresses:
      jetton-master: ${BURN_JETTON_MASTER_ADDRESS:}
      staking-master: ${BURN_STAKING_MASTER_ADDRESS:}
      governor: ${BURN_GOVERNOR_ADDRESS:}
      treasury: ${BURN_TREASURY_ADDRESS:}

# Application info
info:
  app:
    name: BurnedChats
    description: Secure E2E encrypted messaging via Telegram Mini App
    version: "@project.version@"

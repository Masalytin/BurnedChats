# Testnet profile — sync addresses from contracts/deployments/testnet.json [P5-6-1-1]
# Activate from env (NOT inside this file):
#   SPRING_PROFILES_ACTIVE=prod,testnet
# Do NOT add `spring.profiles.active` here — Spring Boot >= 2.4 rejects
# it in profile-specific resources (IMP-TESTNET-PROFILE-01).
# Last deploy sync: 2026-07-14T22:53:35.151Z

app:
  ton:
    network: testnet
    rpc:
      endpoint: ${TONCENTER_ENDPOINT:https://testnet.toncenter.com/api/v2}
      api-key: ${TONCENTER_API_KEY:}
      timeout-ms: ${TONCENTER_TIMEOUT_MS:5000}
      retry-attempts: ${TONCENTER_RETRY_ATTEMPTS:3}
    cache:
      ttl-seconds: ${TONCACHE_TTL_SECONDS:60}
    addresses:
      jetton-master: ${BURN_JETTON_MASTER_ADDRESS:kQCPc6VXgbdbslo6Sed-zyqQvnPBP_2Fwr_gJabVhvhgnGJb}
      staking-master: ${BURN_STAKING_MASTER_ADDRESS:kQAhCcCJ_qYEMfOn8Q5JdRaZtA7lAFk-lwYjvRsogO5Lt6-U}
      governor: ${BURN_GOVERNOR_ADDRESS:kQDdVvbpVIOAvmGPrP9JMnjzDRe8MMFT0QugefFKD7kwjl8s}
      treasury: ${BURN_TREASURY_ADDRESS:kQBM17x78FocwM18ZqohMU9dr0dN5aWk-eKKJNJE7SBCPsZW}

burnedchats:
  wallet-auth:
    ton-api-base-url: ${BURNEDCHATS_TON_API_BASE_URL:https://testnet.toncenter.com/api/v2}

# springdoc OpenAPI + Swagger UI (testnet staging — not prod-only deploy)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true


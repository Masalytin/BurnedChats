# Temporary Nginx configuration for obtaining Let's Encrypt certificates
# Used only during initial certificate setup

server {
    listen 80;
    server_name burnedchats.net www.burnedchats.net;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Return 503 for everything else during cert setup
    location / {
        return 503 "Site is being configured. Please try again in a few minutes.";
        add_header Content-Type text/plain;
    }
}

# Production nginx config for frontend container
# SSL is handled by the main nginx reverse proxy

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # CSP must match nginx/prod.conf (reverse proxy). Identical policies intersect safely;
    # a second policy without media-src blob: would block <video src="blob:..."> (preview, player).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; connect-src 'self' https://burnedchats.net https://*.burnedchats.net wss://burnedchats.net wss://*.burnedchats.net https://telegram.org; img-src 'self' data: blob: https:; media-src 'self' blob:; frame-ancestors 'self' https://web.telegram.org https://telegram.org;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
